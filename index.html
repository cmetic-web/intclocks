<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Clock</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="viewer">
<button id="settingsBtn" class="settings-btn">⚙</button>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>



<div id="clockContainer" class="clock-container"></div>

<div id="settingsPanel" class="settings-panel hidden">

  <div class="settings-header">
    <h3>Select cities to highlight</h3>
    <button id="closeSettingsBtn">x</button>
  </div>

  <div class="top-controls">
    <select id="primarySelect"></select>
    <button id="resetBtn" class="reset-btn">Reset</button>
  </div>

  <div class="format-toggle">
    <span>Time format</span>

    <label>
      <input type="radio" name="timeFormat" value="24" id="format24">
      24:00
    </label>

    <label>
      <input type="radio" name="timeFormat" value="12" id="format12">
      12:00
    </label>
  </div>

  <p class="hint">
    Min 3  &  Max 11 timezones • Max 3 cities per shared timezone
  </p>
  <div id="message" class="message"></div>
  <div id="citySelector" class="city-selector"></div>
</div>
</div>
<script src="scripts.js"></script>

</body>
</html>
